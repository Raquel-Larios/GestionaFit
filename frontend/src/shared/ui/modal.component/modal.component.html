<div class="modal-overlay" *ngIf="isOpen">
    <div class="modal-content">
        <app-form-dinamico
        [fields]="dataFields"
        [data]= "config?.data"
        [cancelBtnOpt]="true"
        [btnStyle]="'save-button'"
        [divBtnStyle]="'centered-button big-button'"
        [btnText]="'Guardar'"
        [errorMessage]="'errorMessage'"
        [successMessage]="'successMessage'"
        (formSubmit)="onFormSubmit($event)"
        >
        </app-form-dinamico>
    </div>
</div>
